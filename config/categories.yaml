# Taxonomie des dépenses et règles de classement.
#
# Ordre de priorité pour classer une opération :
#   1. correction manuelle faite dans le dashboard
#   2. règles « rules » ci-dessous (expression régulière sur le libellé)
#   3. catégorie fournie par Boursorama (via « bank_mapping »)
#   4. « Autres dépenses » / « Autres revenus » (à vérifier dans la page Dépenses › À classer)
#
# type : expense (dépense), income (revenu), transfer (mouvement interne,
# épargne, investissement — exclu du budget).

categories:
  Loyer: {type: expense}          # loyer (ou sa part fixe en colocation)
  Logement: {type: expense}       # autres charges du logement : énergie, eau, assurance habitation…
  Alimentation: {type: expense}
  Restaurants & bars: {type: expense}
  Transports: {type: expense}
  Voyages: {type: expense}
  Shopping: {type: expense}
  Loisirs & culture: {type: expense}
  Santé: {type: expense}
  Soins & beauté: {type: expense}
  Abonnements & télécom: {type: expense}
  Assurances: {type: expense}
  Impôts & taxes: {type: expense}
  Banque & frais: {type: expense}
  Cadeaux & dons: {type: expense}
  Éducation: {type: expense}
  Retraits espèces: {type: expense}
  Autres dépenses: {type: expense}
  Salaire: {type: income}
  Autres revenus: {type: income}
  Remboursements entre amis: {type: expense}   # Lydia, virements entre amis : se compensent
  Aide familiale: {type: income}
  Primes & CE: {type: income}                         # comptées dans les revenus, en plus du salaire
  Remboursement d'impôts (étalé): {type: income}      # voir « etalement » dans les règles du profil
  Ajustements manuels (revenus): {type: income}       # saisis dans Vue globale / Bilan du mois
  Ajustements manuels (dépenses): {type: expense}     # idem : + augmente, − réduit les dépenses
  Remboursements santé: {type: expense}               # mutuelle, CPAM : déduits de la dépense santé
  Virements internes: {type: transfer}
  Épargne livrets: {type: transfer}             # vers / depuis les livrets : épargne nette
  Épargne & investissement: {type: transfer}    # vers les courtiers (rapprochés automatiquement)

# Règles sur le libellé (insensible à la casse). La première qui matche gagne.
#
# « sign: debit » ou « sign: credit » limite une règle aux sorties ou aux entrées d'argent.
# Des règles personnelles (noms de personnes, comptes) peuvent être ajoutées dans
# data/<profil>/regles.yaml : elles passent avant celles-ci et restent sur votre machine.
rules:
  # Carte à débit différé : le prélèvement mensuel du total ne doit pas compter une 2e fois.
  - {pattern: "RELEV[EÉ] DIFF[EÉ]R[EÉ]|DEBIT DIFFERE CARTE|PRLV CARTE DIFFERE", category: Virements internes}
  - {pattern: "SALAIRE|PAIE |REMUNERATION", category: Salaire}
  - {pattern: "PRIME PARRAINAGE|PARRAINAGE", category: Autres revenus, sign: credit}
  - {pattern: "CPAM|MUTUELLE|SEPA GENERATION|\\bALAN\\b|HARMONIE MUTUELLE|\\bMGEN\\b|SWISS ?LIFE PREV", category: Remboursements santé, sign: credit}
  - {pattern: "TDF EMIS VIA CB|LYDIA|PAYLIB|SUMERIA|WERO", category: Remboursements entre amis}
  - {pattern: "TRADE REPUBLIC|BOURSORAMA.*(PEA|BOURSE)|VERS(EMENT)? PEA|ASSURANCE VIE|LINXEA|YOMONI|BINANCE|REVOLUT|\\bIBKR\\b|INTERACTIVE BROKERS|DEGIRO|FORTUNEO BOURSE", category: Épargne & investissement}
  - {pattern: "LIVRET|\\bLDDS?\\b|\\bLEP\\b|\\bCEL\\b|\\bPEL\\b|VIR.*VERS (MON|LIVRET)", category: Épargne livrets}
  # Remboursement d'impôt reçu : un revenu exceptionnel, pas une dépense négative.
  - {pattern: "DGFIP|IMPOT|TRESOR PUBLIC|FINANCES PUBLIQUES", category: Autres revenus, sign: credit}
  - {pattern: "DGFIP|IMPOT|TRESOR PUBLIC|TAXE (FONCIERE|HABITATION)|AMENDE", category: Impôts & taxes}
  - {pattern: "LOYER|FONCIA|NEXITY|EDF|ENGIE|TOTALENERGIES ELEC|EAU DE|SYNDIC", category: Logement}
  - {pattern: "AXA|MAIF|MACIF|MATMUT|ALLIANZ|GENERALI|ASSURANCE|ALAN|MUTUELLE", category: Assurances}
  - {pattern: "UBER ?EATS|DELIVEROO|JUST ?EAT|RESTAU|BRASSERIE|BISTRO|CAFE|BAR |PIZZ|SUSHI|BURGER|MCDO|STARBUCKS|KFC", category: Restaurants & bars}
  - {pattern: "AIR ?FRANCE|EASYJET|RYANAIR|TRANSAVIA|VUELING|LUFTHANSA|BOOKING|AIRBNB|HOTEL|EXPEDIA|ACCOR|HOSTEL", category: Voyages}
  - {pattern: "SNCF|OUIGO|TRAINLINE|UBER|BOLT|HEETCH|RATP|NAVIGO|IDF MOBILITES|VELIB|LIME|TOTAL(ENERGIES)?|ESSO|SHELL|BP |PEAGE|VINCI AUTO|SANEF|PARKING|INDIGO", category: Transports}
  - {pattern: "CARREFOUR|MONOPRIX|FRANPRIX|LIDL|AUCHAN|LECLERC|PICARD|INTERMARCHE|CASINO|NATURALIA|BIOCOOP|G20|SUPER U|U EXPRESS|GRAND FRAIS|BOULANG|PRIMEUR", category: Alimentation}
  - {pattern: "NETFLIX|SPOTIFY|DEEZER|DISNEY|CANAL|APPLE\\.COM|GOOGLE|AMAZON PRIME|FREE MOBILE|FREE TELECOM|ORANGE|SFR|BOUYGUES|SOSH|RED BY|CHATGPT|OPENAI|ANTHROPIC|ICLOUD", category: Abonnements & télécom}
  - {pattern: "PHARMA|DOCTOLIB|MEDECIN|DENTISTE|OPTIC|LABO|HOPITAL|KINE|CPAM", category: Santé}
  - {pattern: "FNAC|DARTY|AMAZON|ZARA|H&M|UNIQLO|DECATHLON|IKEA|LEROY MERLIN|SEPHORA|ZALANDO|VINTED|CELIO|APPLE STORE", category: Shopping}
  - {pattern: "CINEMA|UGC|PATHE|MK2|THEATRE|CONCERT|FNAC SPECTACLE|TICKETMASTER|MUSEE|SALLE DE SPORT|BASIC FIT|FITNESS|STEAM|PLAYSTATION", category: Loisirs & culture}
  - {pattern: "\\bVOI\\b|\\bPONY\\b|\\bDOTT\\b|\\bTIER\\b|\\bGRAB\\b|\\bMOBO\\b|GETAROUND|BLABLACAR|MAX JEUNE|TGV ?MAX|FLIXBUS", category: Transports}
  - {pattern: "VOLOTEA|WIZZ|ITA AIRWAYS|BRITISH AIRWAYS|KLM|IBERIA|TAP AIR|SKYSCANNER|OPODO|MYTRIP|EDREAMS|HOSTELWORLD|GETYOURGUIDE", category: Voyages}
  - {pattern: "NOUS ANTI|\\bNEAG\\b|TOO ?GOOD ?TO ?GO|LA GRANDE EPICERIE|CARREFOUR CITY|SPAR |COOP ", category: Alimentation}
  - {pattern: "SUNDAY\\*|ZENCHEF|THEFORK|LA FOURCHETTE|COFFEE|KAFFE|BAKERY", category: Restaurants & bars}
  - {pattern: "TRADING ?212", category: Épargne & investissement}
  - {pattern: "EGYM|WELLPASS|GYMLIB|CLASSPASS|SHOTGUN|BILLETREDUC|FNAC BILLET|DICE\\.FM", category: Loisirs & culture}
  - {pattern: "LIBRAIRIE CENTRALE|CONVERSE|NIKE|ADIDAS|AIME LEON DORE|COS |UNIQLO|VEEPEE|VINTED|ZARA", category: Shopping}
  - {pattern: "RETRAIT DAB|RET DAB|RETRAIT ", category: Retraits espèces}
  - {pattern: "COTISATION|FRAIS |COMMISSION|AGIOS|INTERETS DEBITEURS", category: Banque & frais}
  - {pattern: "DON |CROIX ROUGE|UNICEF|MSF|LEETCHI|CAGNOTTE", category: Cadeaux & dons}
  - {pattern: "REMBOURSEMENT|REMB |CAF |POLE EMPLOI|FRANCE TRAVAIL|INTERETS CREDITEURS|INTERETS ", category: Autres revenus}

